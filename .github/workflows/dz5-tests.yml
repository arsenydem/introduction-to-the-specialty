# CI для dz_5: unit, functional и e2e тесты
name: dz5 Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "dz_5/**"
      - ".github/workflows/dz5-tests.yml"
  push:
    branches: [main]
    paths:
      - "dz_5/**"
      - ".github/workflows/dz5-tests.yml"

concurrency:
  group: dz5-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dz_5

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dz_5/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/unit -m unit -q

  functional:
    name: Functional tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dz_5/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run functional tests
        run: pytest tests/functional -m functional -q

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: [unit, functional]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dz_5/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Playwright browser
        run: playwright install chromium

      - name: Run e2e tests
        run: pytest tests/e2e -m e2e -q
