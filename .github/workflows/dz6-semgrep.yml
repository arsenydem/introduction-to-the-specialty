# dz_6: статический анализ безопасности (Semgrep)
name: dz6 Semgrep

on:
  pull_request:
    branches: [main]
    paths:
      - "dz_6/**"
      - ".github/workflows/dz6-semgrep.yml"
  push:
    branches: [main]
    paths:
      - "dz_6/**"
      - ".github/workflows/dz6-semgrep.yml"

permissions:
  contents: read

concurrency:
  group: dz6-semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep on application code
        run: |
          semgrep scan \
            --config p/python \
            --config p/secrets \
            --config p/owasp-top-ten \
            --error \
            --metrics=off \
            dz_6/src

      - name: Upload SARIF (optional artifact)
        if: always()
        run: |
          semgrep scan \
            --config p/python \
            --config p/secrets \
            --sarif \
            --output /tmp/semgrep.sarif \
            dz_6/src || true

      - name: Save SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: /tmp/semgrep.sarif
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: semgrep
    defaults:
      run:
        working-directory: dz_6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dz_6/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          API_KEY: ci-test-api-key
        run: pytest -q
