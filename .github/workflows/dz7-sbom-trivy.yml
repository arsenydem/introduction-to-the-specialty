# dz_7: SBOM (Syft) + сканирование уязвимостей (Trivy CLI)
name: dz7 SBOM & Trivy

on:
  pull_request:
    branches: [main]
    paths:
      - "dz_7/**"
      - ".github/workflows/dz7-sbom-trivy.yml"
  push:
    branches: [main]
    paths:
      - "dz_7/**"
      - ".github/workflows/dz7-sbom-trivy.yml"

permissions:
  contents: read

concurrency:
  group: dz7-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: SBOM (Syft)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dz_7
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: dz7-sbom-cyclonedx
          upload-artifact: true

  trivy:
    name: Trivy (vulnerabilities)
    runs-on: ubuntu-latest
    needs: sbom
    defaults:
      run:
        working-directory: dz_7

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy CLI
        uses: aquasecurity/setup-trivy@v0.2.4

      - name: Scan dependencies (table)
        run: |
          trivy fs . \
            --config .trivy.yaml \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --exit-code 1 \
            --output trivy-report.txt

      - name: Scan dependencies (JSON)
        if: always()
        run: |
          trivy fs . \
            --config .trivy.yaml \
            --severity HIGH,CRITICAL,MEDIUM,LOW \
            --ignore-unfixed \
            --format json \
            --exit-code 0 \
            --output trivy-report.json

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dz7-trivy-reports
          path: dz_7/trivy-report.txt
          if-no-files-found: ignore

      - name: Upload Trivy JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dz7-trivy-json
          path: dz_7/trivy-report.json
          if-no-files-found: ignore

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: trivy
    defaults:
      run:
        working-directory: dz_7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dz_7/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest -q
