# dz_7: SBOM (Syft) + уязвимости (Trivy) — через Docker, без GitHub Actions от Aqua
name: dz7 SBOM & Trivy

on:
  pull_request:
    branches: [main]
    paths:
      - "dz_7/**"
      - ".github/workflows/dz7-sbom-trivy.yml"
  push:
    branches: [main]
    paths:
      - "dz_7/**"
      - ".github/workflows/dz7-sbom-trivy.yml"

permissions:
  contents: read

concurrency:
  group: dz7-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: SBOM (Syft)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p dz_7/sbom
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            anchore/syft:latest \
            scan "dir:/workspace/dz_7" \
            -o cyclonedx-json > dz_7/sbom/sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: dz7-sbom-cyclonedx
          path: dz_7/sbom/sbom.cyclonedx.json

  trivy:
    name: Trivy (vulnerabilities)
    runs-on: ubuntu-latest
    needs: sbom

    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan (table)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            aquasec/trivy:latest \
            fs /workspace/dz_7 \
            --config /workspace/dz_7/.trivy.yaml \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --exit-code 1 \
            --output /workspace/dz_7/trivy-report.txt

      - name: Trivy scan (JSON)
        if: always()
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            aquasec/trivy:latest \
            fs /workspace/dz_7 \
            --config /workspace/dz_7/.trivy.yaml \
            --severity HIGH,CRITICAL,MEDIUM,LOW \
            --ignore-unfixed \
            --format json \
            --exit-code 0 \
            --output /workspace/dz_7/trivy-report.json

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dz7-trivy-reports
          path: |
            dz_7/trivy-report.txt
            dz_7/trivy-report.json
          if-no-files-found: ignore

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: trivy
    defaults:
      run:
        working-directory: dz_7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dz_7/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest -q
