[project]
name = "dz5-tests-demo"
version = "1.0.0"
description = "ДЗ 5: unit, functional и e2e тесты"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: изолированные unit-тесты",
    "functional: тесты HTTP API (TestClient)",
    "e2e: сквозные тесты в браузере (Playwright)",
]

[tool.pytest-playwright]
browser = "chromium"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
